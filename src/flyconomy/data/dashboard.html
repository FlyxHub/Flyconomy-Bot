<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyconomy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..700&family=Bodoni+Moda:opsz,wght@6..96,400..700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  /* Security paper and engraving ink: the economy's money, drawn like money. */
  :root {
    color-scheme: light;
    --paper: #dfe7e0;
    --note: #eef3ec;
    --ink: #10303a;
    --ink-2: #46606a;
    --ink-3: #5f767d;
    --rule: #bfccc4;
    --gold: #8a5e0c;
    --gain: #1c7347;
    --loss: #a12f4d;
    --wash: rgba(16, 48, 58, .06);
    --display: "Bodoni Moda", "Didot", Georgia, serif;
    --text: "Archivo", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --paper: #0c1a1f;
      --note: #12252b;
      --ink: #ddeae4;
      --ink-2: #a2b8b2;
      --ink-3: #839b95;
      --rule: #24393f;
      --gold: #d2a54a;
      --gain: #5bc48f;
      --loss: #f0809a;
      --wash: rgba(221, 234, 228, .05);
    }
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 400 15px/1.5 var(--text);
    font-variant-numeric: tabular-nums;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

  .page {
    max-width: 1240px;
    margin: 0 auto;
    padding: 28px 32px 64px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 340px;
    grid-template-areas:
      "top top"
      "note side"
      "ledger ledger";
    gap: 28px 32px;
  }

  /* ---------------------------------------------------------------- top */
  .top { grid-area: top; display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .wordmark {
    margin: 0;
    font: 600 30px/1 var(--display);
    font-variation-settings: "opsz" 96;
    letter-spacing: -.01em;
  }
  #updated { color: var(--ink-2); font-size: 13px; }
  #updated.error { color: var(--loss); }

  /* --------------------------------------------------------------- note */
  .note {
    grid-area: note;
    position: relative;
    overflow: hidden;
    background: var(--note);
    border-radius: 18px;
    padding: 28px 32px 24px;
    /* The double border of a printed note: an outer frame and an inset line. */
    box-shadow: inset 0 0 0 1px var(--rule), inset 0 0 0 7px var(--note), inset 0 0 0 8px var(--rule);
    isolation: isolate;
  }
  .rosette {
    position: absolute;
    z-index: -1;
    width: 460px;
    height: 460px;
    right: -120px;
    top: -150px;
    color: var(--ink);
    opacity: .22;
    pointer-events: none;
  }
  .rosette path { fill: none; stroke: currentColor; stroke-width: .7; vector-effect: non-scaling-stroke; }
  .rosette path.gilt { stroke: var(--gold); }
  .note[data-regime="bull"] .rosette { animation: turn 90s linear infinite; }
  .note[data-regime="bear"] .rosette { animation: turn 90s linear infinite reverse; }
  @keyframes turn { to { transform: rotate(1turn); } }
  .rosette.drawing path { stroke-dasharray: 1; stroke-dashoffset: 1; animation: engrave 1.8s cubic-bezier(.5, 0, .2, 1) forwards; }
  .rosette.drawing path:nth-child(2) { animation-delay: .15s; }
  .rosette.drawing path:nth-child(3) { animation-delay: .3s; }
  .rosette.drawing path:nth-child(4) { animation-delay: .45s; }
  @keyframes engrave { to { stroke-dashoffset: 0; } }

  .note-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .note-head h2 { margin: 0; font: 500 19px/1.2 var(--display); font-style: italic; color: var(--ink-2); }

  .range { display: flex; gap: 2px; padding: 3px; border-radius: 999px; background: var(--wash); }
  .range button {
    border: 0; background: none; cursor: pointer;
    padding: 5px 12px; border-radius: 999px;
    font-size: 13px; font-weight: 500; color: var(--ink-2);
  }
  .range button[aria-pressed="true"] { background: var(--ink); color: var(--note); }

  .denomination {
    margin: 14px 0 0;
    display: flex;
    align-items: flex-start;
    font: 500 clamp(64px, 9vw, 112px)/.9 var(--display);
    font-variation-settings: "opsz" 96;
    letter-spacing: -.02em;
  }
  .denomination .currency { font-size: .38em; margin: .12em .06em 0 0; color: var(--ink-2); }

  .moves { display: flex; flex-wrap: wrap; gap: 4px 20px; margin: 14px 0 0; font-size: 14px; color: var(--ink-2); }
  .up { color: var(--gain); }
  .down { color: var(--loss); }
  .moves strong { font-weight: 600; }

  .price-chart { position: relative; height: 280px; margin: 18px -8px 0; }

  .corners {
    display: flex; flex-direction: column; gap: 18px;
    margin-top: auto; padding-top: 20px;
    border-top: 1px solid var(--rule);
  }
  .corner span { display: block; font-size: 13px; color: var(--ink-2); }
  .corner b { font: 500 34px/1.15 var(--display); }
  .corner small { font-size: 13px; color: var(--ink-2); margin-left: 6px; }

  /* --------------------------------------------------------------- side */
  .side { grid-area: side; display: flex; flex-direction: column; gap: 14px; padding: 8px 0 4px; }
  .side h2 { margin: 0; font: 500 24px/1.2 var(--display); }
  .side p { margin: 0; color: var(--ink-2); max-width: 36ch; }

  .switch {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    margin-top: 6px;
    padding: 5px;
    border-radius: 999px;
    background: var(--note);
    box-shadow: inset 0 0 0 1px var(--rule);
  }
  .switch::before {
    content: "";
    position: absolute;
    top: 5px; bottom: 5px; left: 5px;
    width: calc((100% - 10px) / 3);
    border-radius: 999px;
    background: var(--ink);
    transform: translateX(calc(var(--pos, 1) * 100%));
    transition: transform .35s cubic-bezier(.3, 1.3, .5, 1), background .2s;
  }
  .switch[data-pending]::before { background: var(--gold); }
  .switch button {
    position: relative;
    border: 0; background: none; cursor: pointer;
    padding: 11px 0;
    border-radius: 999px;
    font-weight: 600;
    font-variation-settings: "wdth" 112;
    color: var(--ink-2);
    transition: color .2s;
  }
  .switch button[aria-pressed="true"] { color: var(--note); }
  .switch button:disabled { cursor: not-allowed; opacity: .4; }

  .confirm { display: flex; gap: 8px; flex-wrap: wrap; }
  .confirm[hidden] { display: none; }
  .confirm button {
    cursor: pointer;
    padding: 9px 16px;
    border-radius: 10px;
    border: 1px solid var(--rule);
    background: transparent;
    font-weight: 600;
  }
  .confirm .go { background: var(--gold); border-color: var(--gold); color: var(--note); }
  #result { min-height: 1.5em; font-size: 14px; }
  #result.error { color: var(--loss); }

  /* ------------------------------------------------------------- ledger */
  .ledger { grid-area: ledger; }
  .ledger-head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 8px; }
  .ledger-head h2 { margin: 0; font: 500 24px/1.2 var(--display); }
  .tabs { display: flex; gap: 22px; }
  .tabs button {
    border: 0; background: none; cursor: pointer; padding: 6px 0;
    font-weight: 500; color: var(--ink-2);
    border-bottom: 2px solid transparent;
  }
  .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--gold); }

  table { width: 100%; border-collapse: collapse; }
  th { text-align: left; font-weight: 500; font-size: 13px; color: var(--ink-2); padding: 10px 12px 8px 0; border-bottom: 1px solid var(--rule); }
  td { padding: 11px 12px 11px 0; border-bottom: 1px solid var(--rule); vertical-align: middle; }
  th.num, td.num { text-align: right; padding-right: 0; }
  td.rank { width: 2.5em; font: 500 18px/1 var(--display); color: var(--ink-2); }
  td.name { font-weight: 500; }
  td.amount { font: 500 18px/1 var(--display); }
  td.spark { width: 160px; }
  td.spark svg { display: block; width: 140px; height: 30px; overflow: visible; }
  td.spark polyline { fill: none; stroke: var(--ink-2); stroke-width: 1.5; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
  td.change { width: 140px; font-size: 14px; }
  .ledger[data-board="net_worth"] .flat-only,
  .ledger:not([data-board="net_worth"]) .worth-only { display: none; }
  .empty td { color: var(--ink-2); padding: 24px 0; }

  @media (max-width: 960px) {
    .page { grid-template-columns: 1fr; grid-template-areas: "top" "note" "side" "ledger"; padding: 20px 16px 48px; }
    .side p { max-width: none; }
    .corners { flex-direction: row; flex-wrap: wrap; gap: 12px 40px; }
  }
  @media (max-width: 560px) {
    .note { padding: 22px 18px 18px; }
    .rosette { width: 280px; height: 280px; right: -110px; top: -110px; opacity: .14; }
    .price-chart { height: 220px; }
    td.spark, th.spark { display: none; }
    td.change { width: auto; }
  }
  @media (prefers-reduced-motion: reduce) {
    .note .rosette, .rosette.drawing path { animation: none !important; stroke-dashoffset: 0; }
    .switch::before { transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header class="top">
    <h1 class="wordmark">Flyconomy</h1>
    <span id="updated" role="status">Connecting to the bot…</span>
  </header>

  <section class="note" data-regime="calm" aria-labelledby="note-title">
    <svg class="rosette drawing" viewBox="-110 -110 220 220" aria-hidden="true"></svg>
    <div class="note-head">
      <h2 id="note-title">Flyxcoin</h2>
      <div class="range" role="group" aria-label="Time range">
        <button data-hours="24" aria-pressed="true">24 hours</button>
        <button data-hours="168" aria-pressed="false">7 days</button>
        <button data-hours="744" aria-pressed="false">31 days</button>
      </div>
    </div>
    <p class="denomination" aria-live="polite"><span class="currency">$</span><span id="price">–</span></p>
    <p class="moves"><span id="tick-move"></span><span id="range-move"></span></p>
    <div class="price-chart"><canvas id="price-chart" role="img" aria-label="Flyxcoin price over the selected range"></canvas></div>
  </section>

  <aside class="side" aria-labelledby="steer-title">
    <h2 id="steer-title">Steer the market</h2>
    <p id="regime-text">Reading the market…</p>
    <div class="switch" role="group" aria-label="Market direction">
      <button data-direction="bear" aria-pressed="false">Bear</button>
      <button data-direction="calm" aria-pressed="true">Calm</button>
      <button data-direction="bull" aria-pressed="false">Bull</button>
    </div>
    <div class="confirm" hidden>
      <button class="go" id="confirm-go"></button>
      <button id="confirm-cancel">Cancel</button>
    </div>
    <p id="result" role="status"></p>
    <div class="corners">
      <div class="corner"><span>Lottery pot</span><b id="pot">–</b></div>
      <div class="corner"><span>Flyxcoin held by members</span><b id="circulating">–</b><small id="circulating-value"></small></div>
    </div>
  </aside>

  <section class="ledger" data-board="net_worth" aria-labelledby="ledger-title">
    <div class="ledger-head">
      <h2 id="ledger-title">Richest members</h2>
      <div class="tabs" role="tablist" aria-label="Rank by">
        <button role="tab" data-board="net_worth" aria-selected="true">Net worth</button>
        <button role="tab" data-board="wallet" aria-selected="false">Wallets</button>
        <button role="tab" data-board="crypto" aria-selected="false">Flyxcoin</button>
      </div>
    </div>
    <table>
      <thead>
        <tr>
          <th scope="col"><span class="visually-hidden">Rank</span></th>
          <th scope="col">Member</th>
          <th scope="col" class="spark worth-only">Trend</th>
          <th scope="col" class="change worth-only">Change</th>
          <th scope="col" class="num">Amount</th>
        </tr>
      </thead>
      <tbody id="ledger-rows"></tbody>
    </table>
  </section>
</div>

<script>
const $ = id => document.getElementById(id);
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const whole = n => Math.round(n).toLocaleString();
const money = n => "$" + whole(n);
const RANGE_NAMES = { 24: "24 hours", 168: "7 days", 744: "31 days" };
const POSITIONS = { bear: 0, calm: 1, bull: 2 };

let hours = 24;
let overview = null;
let history = null;
let board = "net_worth";
let pending = null;
let chart = null;

// ------------------------------------------------------------- the rosette
// Hypotrochoids, the curves a banknote's guilloché lathe engraves.
function hypotrochoid(R, r, d, turns) {
  const points = [];
  const steps = 900 * turns;
  for (let i = 0; i <= steps; i++) {
    const t = (i / steps) * Math.PI * 2 * turns;
    const k = (R - r) / r;
    points.push(`${((R - r) * Math.cos(t) + d * Math.cos(k * t)).toFixed(2)},${((R - r) * Math.sin(t) - d * Math.sin(k * t)).toFixed(2)}`);
  }
  return "M" + points.join("L");
}
const rosette = document.querySelector(".rosette");
rosette.innerHTML = [
  [96, 36, 58, 3, ""], [96, 36, 44, 3, "gilt"], [90, 25, 52, 5, ""], [70, 20, 18, 2, "gilt"],
].map(([R, r, d, turns, cls]) => `<path pathLength="1" class="${cls}" d="${hypotrochoid(R, r, d, turns)}"/>`).join("");
setTimeout(() => rosette.classList.remove("drawing"), 2600);

// ------------------------------------------------------------------- data
async function api(path, options) {
  const response = await fetch(path, options);
  const text = await response.text();
  let body = null;
  try { body = JSON.parse(text); } catch {}
  if (!response.ok) throw new Error(body?.error ?? (text || response.statusText));
  return body;
}

function signed(delta, format) {
  const span = document.createElement("span");
  span.className = delta > 0 ? "up" : delta < 0 ? "down" : "";
  span.textContent = (delta > 0 ? "▲ " : delta < 0 ? "▼ " : "") + format(Math.abs(delta));
  return span;
}

function renderNote() {
  if (!overview) return;
  const { market } = overview;
  $("price").textContent = whole(market.price);
  $("pot").textContent = money(overview.lottery_pot);
  $("circulating").textContent = whole(overview.circulating) + " coins";
  $("circulating-value").textContent = "worth " + money(overview.circulating * market.price);
  document.querySelector(".note").dataset.regime = market.regime;

  const prices = history?.prices ?? [];
  const tick = $("tick-move"), range = $("range-move");
  tick.replaceChildren(); range.replaceChildren();
  if (prices.length >= 2) {
    const last = prices[prices.length - 1][1];
    tick.append(signed(last - prices[prices.length - 2][1], money), " on the last tick");
    const first = prices[0][1];
    range.append(signed(((last - first) / first) * 100, v => v.toFixed(1) + "%"), ` over ${RANGE_NAMES[hours]}`);
  } else {
    tick.textContent = "Price history starts with the next market tick.";
  }
}

function renderSteer() {
  if (!overview) return;
  const { regime, minutes_left } = overview.market;
  const sw = document.querySelector(".switch");
  const shown = pending ?? regime;
  sw.style.setProperty("--pos", POSITIONS[shown]);
  sw.toggleAttribute("data-pending", pending !== null);
  sw.querySelectorAll("button").forEach(b => {
    const d = b.dataset.direction;
    b.setAttribute("aria-pressed", d === shown);
    // A run in flight has to be called off before the other one can start.
    b.disabled = regime !== "calm" && d !== "calm" && d !== regime;
  });

  $("regime-text").textContent = regime === "calm"
    ? "The market is calm. An armed run starts on the next tick, within five minutes."
    : `A ${regime} run is going, with about ${minutes_left} minutes left. Call it off and the price eases home over the next few ticks.`;

  const confirm = document.querySelector(".confirm");
  confirm.hidden = pending === null;
  if (pending !== null) {
    $("confirm-go").textContent = pending === "calm" ? `Call off ${regime} run` : `Arm ${pending} run`;
  }
}

function sparkline(points) {
  const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  if (!points || points.length < 2) return svg;
  const xs = points.map(p => p[0]), ys = points.map(p => p[1]);
  const [x0, x1] = [Math.min(...xs), Math.max(...xs)];
  const [y0, y1] = [Math.min(...ys), Math.max(...ys)];
  svg.setAttribute("viewBox", "0 0 140 30");
  svg.setAttribute("preserveAspectRatio", "none");
  svg.setAttribute("aria-hidden", "true");
  const line = document.createElementNS(svg.namespaceURI, "polyline");
  line.setAttribute("points", points.map(([x, y]) =>
    `${((x - x0) / (x1 - x0 || 1) * 140).toFixed(1)},${(28 - (y - y0) / (y1 - y0 || 1) * 26).toFixed(1)}`).join(" "));
  svg.append(line);
  return svg;
}

function cell(className, content) {
  const td = document.createElement("td");
  td.className = className;
  if (content instanceof Node) td.append(content); else td.textContent = content;
  return td;
}

function renderLedger() {
  if (!overview) return;
  document.querySelector(".ledger").dataset.board = board;
  const rows = overview.leaderboards[board];
  const format = board === "crypto" ? n => whole(n) + " coins" : money;
  const series = new Map((history?.members ?? []).map(m => [m.id, m.points]));
  const body = $("ledger-rows");
  if (!rows.length) {
    body.innerHTML = '<tr class="empty"><td colspan="5">Nobody here yet. Members appear once they run their first command.</td></tr>';
    return;
  }
  body.replaceChildren(...rows.map((row, i) => {
    const tr = document.createElement("tr");
    const points = series.get(row.id);
    const change = points && points.length >= 2
      ? signed(points[points.length - 1][1] - points[0][1], money) : "–";
    tr.append(
      cell("rank", String(i + 1)),
      cell("name", row.name),
      cell("spark worth-only", sparkline(points)),
      cell("change worth-only", change),
      cell("amount num", format(row.amount)),
    );
    return tr;
  }));
}

// ------------------------------------------------------------------ chart
const crosshair = {
  id: "crosshair",
  afterDraw(c) {
    const active = c.tooltip?.getActiveElements?.();
    if (!active?.length) return;
    const x = active[0].element.x, { top, bottom } = c.chartArea, ctx = c.ctx;
    ctx.save();
    ctx.strokeStyle = css("--ink-3");
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
    ctx.restore();
  },
};

function timeLabel(seconds) {
  const d = new Date(seconds * 1000);
  return hours <= 24
    ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function renderChart() {
  if (!history) return;
  const data = history.prices.map(([x, y]) => ({ x, y }));
  chart?.destroy();
  chart = new Chart($("price-chart"), {
    type: "line",
    data: { datasets: [{
      label: "Price", data,
      borderColor: css("--ink"), borderWidth: 2,
      backgroundColor: css("--wash"), fill: "start",
      pointRadius: 0, pointHoverRadius: 5, pointHoverBackgroundColor: css("--gold"), pointHoverBorderColor: css("--note"), pointHoverBorderWidth: 2,
      tension: 0,
    }] },
    options: {
      animation: false,
      maintainAspectRatio: false,
      parsing: false,
      interaction: { mode: "index", intersect: false },
      plugins: {
        legend: { display: false },
        tooltip: {
          backgroundColor: css("--ink"), titleColor: css("--note"), bodyColor: css("--note"),
          titleFont: { family: "Archivo", weight: "500" }, bodyFont: { family: "Bodoni Moda", size: 16 },
          padding: 10, displayColors: false, cornerRadius: 8,
          callbacks: {
            title: items => new Date(items[0].parsed.x * 1000).toLocaleString([], { dateStyle: "medium", timeStyle: "short" }),
            label: item => money(item.parsed.y),
          },
        },
      },
      scales: {
        x: {
          type: "linear", min: data[0]?.x, max: data[data.length - 1]?.x,
          ticks: { color: css("--ink-3"), maxTicksLimit: 6, callback: timeLabel, font: { family: "Archivo", size: 12 } },
          grid: { display: false }, border: { color: css("--rule") },
        },
        y: {
          position: "right",
          ticks: { color: css("--ink-3"), maxTicksLimit: 5, callback: v => money(v), font: { family: "Archivo", size: 12 } },
          grid: { color: css("--rule"), drawTicks: false }, border: { display: false },
        },
      },
    },
    plugins: [crosshair],
  });
}

// ---------------------------------------------------------------- refresh
async function loadOverview() { overview = await api("/api/overview"); }
async function loadHistory() { history = await api(`/api/history?hours=${hours}`); }

function renderAll() { renderNote(); renderSteer(); renderLedger(); renderChart(); }

async function refresh() {
  try {
    await Promise.all([loadOverview(), loadHistory()]);
    renderAll();
    $("updated").className = "";
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  } catch (error) {
    $("updated").className = "error";
    $("updated").textContent = `Can't reach the bot: ${error.message} Check that it's running and that FLYCONOMY_DASHBOARD_API_URL points at it.`;
  }
}

// ---------------------------------------------------------------- actions
document.querySelectorAll(".range button").forEach(button => button.addEventListener("click", async () => {
  hours = Number(button.dataset.hours);
  document.querySelectorAll(".range button").forEach(b => b.setAttribute("aria-pressed", b === button));
  try { await loadHistory(); renderNote(); renderLedger(); renderChart(); }
  catch (error) { $("updated").className = "error"; $("updated").textContent = error.message; }
}));

document.querySelectorAll(".tabs button").forEach(button => button.addEventListener("click", () => {
  board = button.dataset.board;
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b === button));
  renderLedger();
}));

document.querySelectorAll(".switch button").forEach(button => button.addEventListener("click", () => {
  if (!overview) return;
  const wanted = button.dataset.direction;
  pending = wanted === overview.market.regime ? null : wanted;
  $("result").textContent = "";
  renderSteer();
  if (pending) $("confirm-go").focus();
}));

$("confirm-cancel").addEventListener("click", () => { pending = null; renderSteer(); });

$("confirm-go").addEventListener("click", async () => {
  const direction = pending === "calm" ? "neutral" : pending;
  const go = $("confirm-go");
  go.disabled = true;
  try {
    const { message } = await api("/api/market", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ direction }),
    });
    $("result").className = "";
    $("result").textContent = message;
    pending = null;
    await loadOverview();
    renderNote(); renderSteer();
  } catch (error) {
    $("result").className = "error";
    $("result").textContent = error.message;
  } finally {
    go.disabled = false;
  }
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && pending) { pending = null; renderSteer(); }
});

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderChart);
document.fonts.ready.then(renderChart);
refresh();
setInterval(refresh, 60_000);
</script>
</body>
</html>
