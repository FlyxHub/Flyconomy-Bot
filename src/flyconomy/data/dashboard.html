<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flyconomy Dashboard</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root {
    color-scheme: light;
    --surface-0: #f3f2ef;
    --surface-1: #fcfcfb;
    --border: #e2e1dc;
    --grid: #ebeae6;
    --text-primary: #0b0b0b;
    --text-secondary: #52514e;
    --text-muted: #7a7974;
    --accent: #2a78d6;
    --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
    --series-5: #e87ba4; --series-6: #008300; --series-7: #4a3aa7; --series-8: #e34948;
    --good: #008300; --critical: #c62f2e;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-0: #111110;
      --surface-1: #1a1a19;
      --border: #2e2e2c;
      --grid: #262624;
      --text-primary: #ffffff;
      --text-secondary: #c3c2b7;
      --text-muted: #8f8e86;
      --accent: #3987e5;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
      --good: #3aa53a; --critical: #e66767;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px; background: var(--surface-0); color: var(--text-primary);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  main { max-width: 1200px; margin: 0 auto; display: grid; gap: 16px; }
  header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; }
  h1 { font-size: 20px; margin: 0; }
  h2 { font-size: 14px; margin: 0 0 12px; color: var(--text-secondary); font-weight: 600; }
  .muted { color: var(--text-muted); font-size: 12px; }
  .card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 16px; min-width: 0; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 16px; }
  .tile .label { color: var(--text-secondary); font-size: 12px; }
  .tile .value { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 4px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  button {
    font: inherit; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary);
  }
  button:hover { border-color: var(--text-muted); }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #fff; }
  button:disabled { opacity: .5; cursor: wait; }
  #status { min-height: 1.45em; }
  #status.error { color: var(--critical); }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(420px, 1fr)); gap: 16px; }
  .chart-box { position: relative; height: 300px; }
  .boards { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  td { padding: 5px 0; border-top: 1px solid var(--grid); }
  td:first-child { color: var(--text-muted); width: 2em; }
  td:last-child { text-align: right; }
  @media (max-width: 480px) { .charts { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <header>
    <h1>Flyconomy</h1>
    <span class="muted" id="updated">Loading…</span>
  </header>

  <section class="tiles">
    <div class="card tile"><div class="label">Flyxcoin price</div><div class="value" id="price">–</div></div>
    <div class="card tile"><div class="label">Market</div><div class="value" id="regime">–</div></div>
    <div class="card tile"><div class="label">Lottery pot</div><div class="value" id="pot">–</div></div>
    <div class="card tile"><div class="label">Coins in circulation</div><div class="value" id="circulating">–</div></div>
  </section>

  <section class="card">
    <h2>Steer the market</h2>
    <div class="controls">
      <button data-direction="bull">Start bull run</button>
      <button data-direction="bear">Start bear run</button>
      <button data-direction="neutral">Call off run</button>
    </div>
    <p id="status" class="muted" role="status"></p>
  </section>

  <section class="controls" aria-label="Time range">
    <span class="muted">Range</span>
    <button data-hours="24" aria-pressed="true">24 hours</button>
    <button data-hours="168">7 days</button>
    <button data-hours="744">31 days</button>
  </section>

  <section class="charts">
    <div class="card">
      <h2>Flyxcoin price</h2>
      <div class="chart-box"><canvas id="price-chart" aria-label="Flyxcoin price over time"></canvas></div>
    </div>
    <div class="card">
      <h2>Net worth, top 8</h2>
      <div class="chart-box"><canvas id="worth-chart" aria-label="Net worth of the richest members over time"></canvas></div>
    </div>
  </section>

  <section class="boards">
    <div class="card"><h2>Net worth</h2><table id="board-net_worth"></table></div>
    <div class="card"><h2>Wallets</h2><table id="board-wallet"></table></div>
    <div class="card"><h2>Flyxcoin held</h2><table id="board-crypto"></table></div>
  </section>
</main>

<script>
const money = n => "$" + Math.round(n).toLocaleString();
const coins = n => Math.round(n).toLocaleString() + " FLX";
const css = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
const $ = id => document.getElementById(id);
const REGIMES = { calm: "Calm", bull: "Bull run", bear: "Bear run" };
const SERIES = 8;

let hours = 24;
let history = null;
const charts = {};

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.text();
  if (!response.ok) {
    let message = body;
    try { message = JSON.parse(body).error ?? body; } catch {}
    throw new Error(message || response.statusText);
  }
  return JSON.parse(body);
}

function showStatus(text, isError) {
  $("status").textContent = text;
  $("status").className = isError ? "error" : "muted";
}

function fillBoard(id, rows, format) {
  const table = $("board-" + id);
  table.replaceChildren(...rows.map((row, i) => {
    const tr = document.createElement("tr");
    for (const text of [i + 1, row.name, format(row.amount)]) {
      const td = document.createElement("td");
      td.textContent = text;
      tr.append(td);
    }
    return tr;
  }));
  if (!rows.length) table.innerHTML = '<tr><td></td><td class="muted">Nobody yet</td><td></td></tr>';
}

async function loadOverview() {
  const data = await api("/api/overview");
  const m = data.market;
  $("price").textContent = money(m.price);
  $("regime").textContent = REGIMES[m.regime] + (m.regime === "calm" ? "" : ` · ${m.minutes_left}m`);
  $("pot").textContent = money(data.lottery_pot);
  $("circulating").textContent = coins(data.circulating);
  fillBoard("net_worth", data.leaderboards.net_worth, money);
  fillBoard("wallet", data.leaderboards.wallet, money);
  fillBoard("crypto", data.leaderboards.crypto, coins);
}

function timeLabel(seconds) {
  const d = new Date(seconds * 1000);
  return hours <= 24
    ? d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" })
    : d.toLocaleDateString([], { month: "short", day: "numeric" });
}

function lineOptions(format, legend) {
  return {
    animation: false,
    maintainAspectRatio: false,
    parsing: false,
    interaction: { mode: legend ? "nearest" : "index", axis: "x", intersect: false },
    plugins: {
      legend: { display: legend, position: "bottom", labels: { color: css("--text-secondary"), boxWidth: 12, boxHeight: 2 } },
      tooltip: {
        callbacks: {
          title: items => new Date(items[0].parsed.x * 1000).toLocaleString(),
          label: item => `${item.dataset.label}: ${format(item.parsed.y)}`,
        },
      },
    },
    scales: {
      x: {
        type: "linear",
        ticks: { color: css("--text-muted"), maxTicksLimit: 6, callback: timeLabel },
        grid: { display: false },
        border: { color: css("--border") },
      },
      y: {
        ticks: { color: css("--text-muted"), callback: v => format(v) },
        grid: { color: css("--grid") },
        border: { display: false },
      },
    },
  };
}

function draw(id, datasets, format, legend) {
  // Keep series hidden from the legend hidden across the minutely refresh.
  const old = charts[id];
  const hidden = new Set(old ? old.data.datasets.filter((d, i) => !old.isDatasetVisible(i)).map(d => d.label) : []);
  datasets.forEach(d => d.hidden = hidden.has(d.label));
  old?.destroy();
  charts[id] = new Chart($(id), { type: "line", data: { datasets }, options: lineOptions(format, legend) });
}

function line(label, points, color) {
  return {
    label, borderColor: color, backgroundColor: color, borderWidth: 2,
    pointRadius: 0, pointHoverRadius: 4, tension: 0,
    data: points.map(([x, y]) => ({ x, y })),
  };
}

function renderCharts() {
  if (!history) return;
  draw("price-chart", [line("Price", history.prices, css("--series-1"))], money, false);

  // Ranked by where each member ends up, and coloured in that order.
  const top = history.members
    .map(m => ({ ...m, last: m.points[m.points.length - 1][1] }))
    .sort((a, b) => b.last - a.last)
    .slice(0, SERIES);
  draw("worth-chart", top.map((m, i) => line(m.name, m.points, css(`--series-${i + 1}`))), money, true);
}

async function loadHistory() {
  history = await api(`/api/history?hours=${hours}`);
  renderCharts();
}

async function refresh() {
  try {
    await Promise.all([loadOverview(), loadHistory()]);
    $("updated").textContent = "Updated " + new Date().toLocaleTimeString();
  } catch (error) {
    $("updated").textContent = "Could not reach the bot: " + error.message;
  }
}

document.querySelectorAll("[data-hours]").forEach(button => button.addEventListener("click", async () => {
  hours = Number(button.dataset.hours);
  document.querySelectorAll("[data-hours]").forEach(b => b.setAttribute("aria-pressed", b === button));
  try { await loadHistory(); } catch (error) { $("updated").textContent = error.message; }
}));

document.querySelectorAll("[data-direction]").forEach(button => button.addEventListener("click", async () => {
  const direction = button.dataset.direction;
  if (direction !== "neutral" && !confirm(`Arm a ${direction} run? It starts on the next market tick.`)) return;
  const buttons = document.querySelectorAll("[data-direction]");
  buttons.forEach(b => b.disabled = true);
  try {
    const result = await api("/api/market", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ direction }),
    });
    showStatus(result.message, false);
    await loadOverview();
  } catch (error) {
    showStatus(error.message, true);
  } finally {
    buttons.forEach(b => b.disabled = false);
  }
}));

matchMedia("(prefers-color-scheme: dark)").addEventListener("change", renderCharts);
refresh();
setInterval(refresh, 60_000);
</script>
</body>
</html>
