# Production deployment for Linux hosts.
#
#   docker compose up -d          Start in the background
#   docker compose logs -f        Follow the logs
#   docker compose pull && docker compose up -d --build   Upgrade
services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: flyconomy-bot:latest
    container_name: flyconomy-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides .env so the database always lands on the volume below.
      FLYCONOMY_DATABASE_PATH: /data/bot.db
      # The dashboard API has to listen on every interface *inside* the
      # container; what the host actually exposes is the port mapping below.
      FLYCONOMY_API_HOST: 0.0.0.0
    volumes:
      - flyconomy-data:/data
    # Docker's embedded resolver (127.0.0.11) forwards to whatever DNS server
    # was reachable when the daemon started, which on this host adds ~4s to
    # every lookup -- and every outbound call the bot makes starts with one.
    # Pointing straight at public resolvers skips that broken hop.
    dns:
      - 1.1.1.1
      - 1.0.0.1
    # The dashboard API, which stays silent until FLYCONOMY_API_TOKEN is set.
    # Published on the host's loopback only, so reaching it from another
    # machine takes an SSH tunnel unless FLYCONOMY_API_BIND (read from .env)
    # names an interface. It can steer the market: never bind it to one that
    # faces the internet.
    ports:
      - "${FLYCONOMY_API_BIND:-127.0.0.1}:8765:8765"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  flyconomy-data:
    driver: local
